<title>{{TITLE}}</title>
<link rel="stylesheet" href="three-cad-viewer.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* A design review sheet: a drawing title block, then the model beside its inspection report. */
  :root {
    --paper: #eef1f4; --sheet: #ffffff; --ink: #16202a; --muted: #5a6876; --rule: #d3dae1;
    --accent: #2356c4; --accent-soft: #e3ebfb;
    --pass: #1d8750; --fail: #c93232; --warn: #a97300; --na: #87939f;
    --vp-top: #fbfcfd; --vp-bot: #dce3ea;
    --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0d1217; --sheet: #141b22; --ink: #e2e8ee; --muted: #93a0ad; --rule: #28323c;
      --accent: #7ba3ff; --accent-soft: #1b2944;
      --pass: #3db675; --fail: #f06a6a; --warn: #e0ab35; --na: #7b8793;
      --vp-top: #1a222b; --vp-bot: #0f1419;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0d1217; --sheet: #141b22; --ink: #e2e8ee; --muted: #93a0ad; --rule: #28323c;
    --accent: #7ba3ff; --accent-soft: #1b2944;
    --pass: #3db675; --fail: #f06a6a; --warn: #e0ab35; --na: #7b8793;
    --vp-top: #1a222b; --vp-bot: #0f1419;
    color-scheme: dark;
  }
  body { background: var(--paper); color: var(--ink); font: 14px/1.5 var(--body); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }
  h1, h2 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
  h1 { font-size: 30px; letter-spacing: -.2px; line-height: 1.15; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted); }
  code, .num { font-family: var(--mono); font-size: 12.5px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* title block, drawn like the corner of a drawing sheet */
  .titleblock { display: grid; grid-template-columns: 2.2fr repeat(4, minmax(0, 1fr)); border: 1.5px solid var(--ink);
    background: var(--sheet); }
  .titleblock > div { padding: 9px 12px; border-left: 1px solid var(--rule); min-width: 0; }
  .titleblock > div:first-child { border-left: 0; }
  .tb-label { display: block; font: 600 10.5px var(--display); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .tb-value { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .titleblock .name .tb-value { font-family: var(--display); }
  .verdict { display: inline-flex; align-items: center; gap: 6px; font: 700 13px var(--display); letter-spacing: .6px; text-transform: uppercase; }
  .verdict::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: currentColor; }
  .s-pass { color: var(--pass); } .s-fail { color: var(--fail); } .s-warn { color: var(--warn); } .s-na { color: var(--na); }
  @media (max-width: 760px) {
    .titleblock { grid-template-columns: 1fr 1fr; }
    .titleblock > div { border-left: 0; border-top: 1px solid var(--rule); }
    .titleblock > div:first-child { grid-column: 1 / -1; border-top: 0; }
    .titleblock > div:nth-child(odd):not(:first-child) { border-left: 1px solid var(--rule); }
  }

  .reasons { margin: 0; padding: 12px 16px 12px 34px; background: var(--sheet); border: 1px solid var(--rule); border-left: 3px solid var(--warn); }
  .reasons.done { border-left-color: var(--pass); list-style: none; padding-left: 16px; }
  .reasons li { margin: 2px 0; }

  .main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 960px) { .main { grid-template-columns: 1fr; } }

  /* the model */
  .model { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 8px; }
  @media (max-width: 960px) { .model { position: static; } }
  .viewer { position: relative; height: min(68vh, 600px); min-height: 320px; border: 1px solid var(--rule);
    background: linear-gradient(var(--vp-top), var(--vp-bot)); overflow: hidden; }
  #view { position: absolute; inset: 0; }

  /* the report */
  .report { display: grid; gap: 22px; min-width: 0; }
  .report section { display: grid; gap: 8px; }
  .table { overflow-x: auto; border: 1px solid var(--rule); background: var(--sheet); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { font: 600 10.5px var(--display); letter-spacing: .9px; text-transform: uppercase; color: var(--muted); text-align: left;
    padding: 7px 10px; border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .readout { margin: 0; font-size: 12.5px; color: var(--muted); }
  td.state { white-space: nowrap; font: 700 11px var(--display); letter-spacing: .6px; }
  td.num { white-space: nowrap; }
  td .src { display: block; color: var(--muted); font-size: 12px; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 7px; vertical-align: baseline; border: 1px solid rgba(0,0,0,.2); }
  details > summary { cursor: pointer; font: 600 12.5px var(--display); letter-spacing: .5px; color: var(--muted); padding: 4px 0; }
  .renders { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  figure { margin: 0; border: 1px solid var(--rule); background: var(--sheet); }
  figure img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #fff; }
  figcaption { padding: 6px 8px; font-size: 12px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 6px; }
  .foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 12px; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>


<div class="wrap">
  <header class="titleblock" id="titleblock" aria-label="Title block"></header>
  <ul class="reasons" id="reasons" hidden></ul>
  <div class="main">
    <div class="model">
      <div class="viewer"><div id="view"></div></div>
      <p class="readout">Double-click a part to find it in the tree. The toolbar has views, clipping, explode and measuring.</p>
    </div>
    <div class="report">
      <section><h2>Gates</h2><div id="gates"></div></section>
      <section><h2>Parts</h2><div class="table"><table><thead><tr><th>Part</th><th>Material</th><th>Mass</th><th>Size, mm</th></tr></thead><tbody id="parts"></tbody></table></div></section>
      <section id="render-section"><h2>Renders</h2><div class="renders" id="renders"></div></section>
    </div>
  </div>
  <p class="foot" id="foot"></p>
</div>
<script type="module" src="page.js"></script>
