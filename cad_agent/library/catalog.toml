# The part library's catalog: what cad-agent ships, and where every number in it came from.
#
# cad_agent/library/catalog.py says what each key means. In short: a `generator` entry is geometry the repo draws
# (cad_agent/library/gen/) from the numbers under its [dims], each with the page it was read from; a `step` entry is a
# file somebody else made, pinned by URL and sha256 and never in this repo; a `bd_warehouse` entry is drawn by that
# package. A number no source gives is not here, and what needs it is UNCHECKED (a part with no mass declares none, a
# part with no rating declares none, a dimension nobody publishes makes the part unconfirmed).
#
# Read on 2026-10-10 unless an entry says otherwise. Corners of 0.5 mm or less are drawn sharp in the extrusions, at the
# point where their two walls meet.

# ─── HIWIN MG series: rails and carriages ───────────────────────────────────
# One document for all of them: HIWIN's linear guideways catalog GW-11-5-EN-2207-K, pages 92 to 105 (the MG series),
# as damencnc.com hosts them. Table 3.79 (page 97) is the blocks, 3.81 (page 99) the MGN rails. Weights are the
# tables' own: kg for a block, kg per metre for a rail.

[parts.mgn12-rail]
title = "HIWIN MGNR12R miniature linear guide rail"
kind = "generator"
generator = "cad_agent.library.gen.mgn:rail"
vendor = "HIWIN"
pn = "MGNR12R"
licence = "MIT"
geometry = "envelope"
source = "HIWIN MG series catalog GW-11-5-EN-2207-K, table 3.81 (page 99): MGNR12R, 12 wide and 8.0 high, holes every 25 mm, counterbore D 6.0 x 4.5 deep, through hole d 3.5, cut to length with the most holes that leave E at least 5 (F 3.16, note 2). An envelope: no ball grooves."
docs = ["https://damencnc.com/userdata/file/3455-3_HIWIN_MGN_and_MGW_Product_Catalog_2023.pdf", "https://damencnc.com/userdata/file/730-3_HIWIN_Manual.pdf"]
