# ─── bd_warehouse: ISO fasteners, drawn by the package (Apache-2.0, `pip install 'cad-agent[fasteners]'`) ─
# bd_warehouse 0.4.0 draws them from the ISO tables, unthreaded (simple = True) with the head's bearing face at z = 0 and
# the shank toward -z. tests/test_library.py holds M3 and M4 of each to the standard's tables as three pages print them:
