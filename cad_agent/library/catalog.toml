# ─── Aluminium T-slot extrusion ─────────────────────────────────────────────
# The exact sections are drawn from Framing Tech's own models of its profiles (STEP files from the product pages,
# SolidWorks, 6063-T6): the section at mid length, measured with build123d on 2026-10-10. Each model's section area
# and second moments are the ones tests/test_library.py holds the generator to (within 1 percent). The model is
# not redistributed; its sha256 is given so that the measurement can be repeated on the same file:
#   20x20.STEP     407074 bytes  c601a3ccf0993878701cba4238a89afacfc44fb48d358c620613b68c3ed8df7b
#   20x40.STEP     824630 bytes  9e30c8a379463208ff1113f9bfc2cdc6740ac4d2747408fab42a914c2b735047
#   40x40-08.STEP  370422 bytes  0b7fdcde18f3ee3a6f37bc9363912fac173c1b84eabdf5b02bee6126dd73631a
# The mass of a metre is that section's area at materials.py's density for aluminium. The pages' own weights are
# not used where they disagree with their own areas: the 20 x 20 page says 0.40 kg/m and 1.60 cm2 (0.43 at 2.70
# g/cm3), the 20 x 40 page 1.19 kg/m and 2.85 cm2 (0.77), the 40 x 40 page 1.75 kg/m and 6.49 cm2 (1.75).

[parts.extrusion-2020]
title = "20 x 20 T-slot aluminium extrusion, 6 mm slots, the real section"
kind = "generator"
generator = "cad_agent.library.gen.extrusion:tslot6"
vendor = "Framing Tech"
pn = "20x20"
licence = "MIT"
geometry = "exact"
material = "aluminium"
source = "Framing Tech's model of its 20 x 20 profile, 20x20.STEP (SolidWorks 2016): the section at mid length, 167.794 mm2 with Ix = Iy = 6938.5 mm4; its page says 6063-T6, four 6 mm T-slots, a centre bore for M6, 1.60 cm2 and 0.67 cm4. The model's slot edges rounded 0.5 mm or less are drawn sharp. A stiffness rule may stand on it."
docs = ["https://framingtech.com/products/t-slot-extrusions/aluminum-extrusions/20-series-6mm-t-slot/20-x-20", "https://framingtech.com/web/content/212492?download=true"]
notes = ["the section is 0.30 percent over the model's area and 0.13 percent over its second moments (tests/test_library.py holds it to 1 percent)", "no temperature is declared: the part rates as aluminium in materials.py"]

