# The PCB fab's Klipper config, draft (2026-11-03). Axes, travels and drives are the CAD's (projects/*/assembly.py,
# MOTION.md). Pins are placeholders until the electronics lane's pin map: every "PIN_*" must be replaced.
# LumenPnP's own X, Y and nozzle axes stay as Opulo configures them (its own config); this file adds the fab's.

[mcu]
serial: /dev/serial/by-id/PLACEHOLDER-octopus

[printer]
kinematics: none                 # every fab axis is a manual stepper; LumenPnP's gantry keeps Opulo's config
max_velocity: 100
max_accel: 1000

# --- the stage (fab_stage): SFU1204, 4 mm lead, 40 mm NEMA 17s ------------------------------------------------
[manual_stepper stage_x]
step_pin: PIN_STAGE_X_STEP
dir_pin: PIN_STAGE_X_DIR
enable_pin: !PIN_STAGE_X_EN
microsteps: 16
rotation_distance: 4             # SFU1204 lead
velocity: 50
accel: 1000
endstop_pin: ^PIN_STAGE_X_STOP
position_min: -65
position_max: 65
position_endstop: -65

[manual_stepper stage_y]
step_pin: PIN_STAGE_Y_STEP
dir_pin: PIN_STAGE_Y_DIR
enable_pin: !PIN_STAGE_Y_EN
microsteps: 16
rotation_distance: 4
velocity: 50
accel: 1000
endstop_pin: ^PIN_STAGE_Y_STOP
position_min: -102.5
position_max: 102.5
position_endstop: -102.5

# --- the platen lift: two Tr8x2 screws, 34 mm NEMA 17s, one stepper group -------------------------------------
[manual_stepper platen_lift]
step_pin: PIN_LIFT1_STEP
dir_pin: PIN_LIFT1_DIR
enable_pin: !PIN_LIFT1_EN
microsteps: 16
rotation_distance: 2             # Tr8x2 lead (self-locking)
velocity: 20
accel: 200
endstop_pin: ^PIN_LIFT_STOP      # at the top: work (0)
position_min: -135
position_max: 0
position_endstop: 0
# The second lift motor runs in step with the first: wire it to the same driver signals (two drivers fed by one
# step/dir) or give it its own [manual_stepper] and always move both with SYNC=1 in the macros below.

# --- the flip: GT2 20T to 40T, a 34 mm NEMA 17; positions in degrees of the frame --------------------------------
[manual_stepper flip]
step_pin: PIN_FLIP_STEP
dir_pin: PIN_FLIP_DIR
enable_pin: !PIN_FLIP_EN
microsteps: 16
rotation_distance: 180           # 360 degrees of the frame per 2 motor turns (2:1), so 180 per turn
velocity: 90                     # 2 s for the half turn (MOTION.md: 1 s is too tight)
accel: 180
endstop_pin: ^PIN_FLIP_INDEX     # the index at 0
position_min: 0
position_max: 180
position_endstop: 0

# --- the laser bridge's focus: two Tr8x2 screws ----------------------------------------------------------------
[manual_stepper focus_z]
step_pin: PIN_FOCUS1_STEP
dir_pin: PIN_FOCUS1_DIR
enable_pin: !PIN_FOCUS1_EN
microsteps: 16
rotation_distance: 2
velocity: 5
accel: 50
endstop_pin: ^PIN_FOCUS_STOP
position_min: -10
position_max: 10
position_endstop: 10

# --- the head's air slides (SMC MXH10 on 24 V valves) and the vacuum ------------------------------------------
[output_pin slide_pen_1]
pin: PIN_VALVE_PEN1
[output_pin slide_pen_2]
pin: PIN_VALVE_PEN2
[output_pin slide_jet_1]
pin: PIN_VALVE_JET1
[output_pin slide_jet_2]
pin: PIN_VALVE_JET2
[output_pin vacuum_pump]
pin: PIN_PUMP
[output_pin vacuum_valve]
pin: PIN_VAC_VALVE
[output_pin uv_lamps]
pin: PIN_UV_ENABLE               # also cut by the safety relay in hardware when a door opens
pwm: True

# --- the platen heater: 625 W through the Omron SSR, PT1000 through the MAX31865 --------------------------------
[heater_generic platen]
heater_pin: PIN_SSR
sensor_type: MAX31865
sensor_pin: PIN_MAX31865_CS
spi_bus: spi1
rtd_reference_r: 4300            # Adafruit 3648 (PT1000): check its reference resistor on the board (not read here)
rtd_nominal_r: 1000
rtd_num_of_wires: 2
control: pid
pid_Kp: 50
pid_Ki: 1
pid_Kd: 200                      # to be tuned (PID_CALIBRATE HEATER=platen TARGET=160)
min_temp: 0
max_temp: 240                    # Juan's cap; the Selco cut-out opens at 249 to 271 C regardless
max_power: 1.0

[verify_heater platen]
check_gain_time: 120

# --- the job's safe moves: a tool lowers only over the board (MOTION.md section 4) ------------------------------
[gcode_macro FAB_HOME]
gcode:
  MANUAL_STEPPER STEPPER=platen_lift ENABLE=1
  MANUAL_STEPPER STEPPER=platen_lift MOVE=0 STOP_ON_ENDSTOP=1
  MANUAL_STEPPER STEPPER=focus_z MOVE=10 STOP_ON_ENDSTOP=1
  MANUAL_STEPPER STEPPER=flip MOVE=0 STOP_ON_ENDSTOP=1
  MANUAL_STEPPER STEPPER=stage_x MOVE=-65 STOP_ON_ENDSTOP=1
  MANUAL_STEPPER STEPPER=stage_y MOVE=-102.5 STOP_ON_ENDSTOP=1

[gcode_macro FAB_FLIP]
description: Turn the board over: the gantry parked, the platen down, the frame half a turn, the platen up.
gcode:
  {% set side = params.SIDE|default(180)|float %}
  SET_PIN PIN=vacuum_pump VALUE=0
  SET_PIN PIN=vacuum_valve VALUE=1
  MANUAL_STEPPER STEPPER=stage_x MOVE=0
  MANUAL_STEPPER STEPPER=stage_y MOVE=0
  MANUAL_STEPPER STEPPER=platen_lift MOVE=-135
  MANUAL_STEPPER STEPPER=flip MOVE={side}
  MANUAL_STEPPER STEPPER=platen_lift MOVE=0
  SET_PIN PIN=vacuum_valve VALUE=0
  SET_PIN PIN=vacuum_pump VALUE=1

[gcode_macro FAB_TILE]
description: Put one of the laser's 3 x 4 tiles (100 mm field) under the lens.
gcode:
  {% set i = params.I|int %}
  {% set j = params.J|int %}
  MANUAL_STEPPER STEPPER=stage_x MOVE={-65 + i * 65}
  MANUAL_STEPPER STEPPER=stage_y MOVE={-102.5 + j * 68.333}
