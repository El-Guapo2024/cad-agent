# What the fab must do, as the kernel can measure it.

[envelope]                   # LumenPnP 300 mm longer in its enclosure: a bench machine
max_mm = [900, 1100, 640]

[[heat]]                     # reflow: the plate's zone (the board is the work, rated for a reflow pass, and not shown on it)
source = "hot_plate"
temp_c = 250
radius_mm = 15

[[clearance]]                # the lens over the laser board: its working distance, nothing in the beam
a = "ftheta_lens"
b = "pcb_blank"
min_mm = 213.1
max_mm = 213.6

[[clearance]]                # the gantry passes under the lens to reach the laser bed
a = "lumenpnp_long/x_gantry"
b = "ftheta_lens"
min_mm = 10.0
pose = "pick_laser"

[[clearance]]                # ... and over the laser bed's pins
a = "lumenpnp_long/x_gantry"
b = "reg_pin_1"
min_mm = 5.0
pose = "pick_laser"

[[clearance]]                # the middle uv lamp over the laser board: close enough to cure, clear of it
a = "uv_lamp_3"
b = "pcb_blank"
min_mm = 10.0
max_mm = 30.0
pose = "uv_cure"

[[clearance]]                # ... and the front row over the pins
a = "uv_lamp_1"
b = "reg_pin_1"
min_mm = 5.0
pose = "uv_cure"

[[holes]]                    # the vacuum bed's grid for the via paste
body = "vacuum_bed"
count = 81
min_dia_mm = 0.9
max_dia_mm = 1.1
axis = "z"

[[shaft_fit]]                # the board's tooling holes over the laser bed's pins: a slip fit
shaft = "reg_pin_1"
bore = "pcb_blank"
min_mm = 0.05
max_mm = 0.2

[[deflection]]               # the bridge under the laser plate: UV source 6.5 kg, galvo 2.2 (heaviest listing), plate 1.9, spacer 0.5, lens ~0.5 (not on its page), all at mid-span, shared by the two beams
body = "bridge_beam_1"
support = "simple"
span_mm = 780
load_g = 5800
max_um = 100
