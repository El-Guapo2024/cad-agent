# What the fab must do, as the kernel can measure it. The fixture's own rules (the platen's heat, the flip, the
# stage's travel) are in fab_stage/spec.toml, the bridge's sag and focus travel in laser_bridge/spec.toml.

[envelope]                   # the cabinet, the enclosure, and the extractor on the bench beside it
max_mm = [1200, 1070, 890]

[[clearance]]                # the lens over the board: its working distance (Jenoptik: 235.8)
a = "laser_bridge/ftheta_lens"
b = "fab_stage/pcb_blank"
min_mm = 235.5
max_mm = 236.1

[[clearance]]                # the gantry passes under the lens to reach the board's far end
a = "lumenpnp_long/x_gantry"
b = "laser_bridge/ftheta_lens"
min_mm = 10.0
pose = "under_lens"

[[clearance]]                # ... and so do the head's tools
a = "head_tools/eco_pen_1"
b = "laser_bridge/ftheta_lens"
min_mm = 3.0
pose = "under_lens"

[[clearance]]                # the tools, raised, over the flip frame
a = "head_tools/pico_jet_1"
b = "fab_stage/frame_ring_upper"
min_mm = 3.0
pose = "under_lens"

[[clearance]]                # the middle UV lamp over the board: close enough to cure, clear of it
a = "uv_lamp_3"
b = "fab_stage/pcb_blank"
min_mm = 10.0
max_mm = 30.0
pose = "uv_cure"

[[clearance]]                # ... and the lamps over the fixture's posts
a = "uv_lamp_1"
b = "fab_stage/post_1"
min_mm = 3.0
pose = "uv_cure"
