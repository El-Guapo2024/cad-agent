# What the head's process tools must do, as the kernel can measure it.

[envelope]
max_mm = [230, 190, 240]

[[axis]]
name = "eco_pen_1_z"
direction = [0, 0, 1]
travel_min_mm = 16

[[axis]]
name = "pico_jet_1_z"
direction = [0, 0, 1]
travel_min_mm = 16

[[mass]]                     # what the tools add to LumenPnP's X carriage (belt driven): heavy, see pcbfab/MOTION.md
bodies = ["tool_plate", "slide_1", "slide_2", "slide_3", "slide_4", "pen_clamp_1", "pen_clamp_2", "eco_pen_1", "eco_pen_2", "pico_jet_1", "pico_jet_2", "height_sensor"]
max_g = 2700
