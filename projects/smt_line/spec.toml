# The line, as the kernel can measure it.

[envelope]                   # two modules on a 1.8 m bench
max_mm = [1750, 720, 520]

[[clearance]]                # SMEMA 1.2: the board jumps at most 9.5 from the conveyor's rail ends to the oven
a = "pnp_conveyor"
b = "reflow_oven"
min_mm = 1.0
max_mm = 9.5

[[clearance]]                # the oven and its stand stand clear of the pick-and-place
a = "pnp_v4"
b = "reflow_oven"
min_mm = 1.0

[[clearance]]
a = "pnp_v4"
b = "oven_stand"
min_mm = 1.0
