# The line, as the kernel can measure it.

[envelope]                   # two modules on a 1.8 m bench
max_mm = [1750, 720, 520]

[[clearance]]                # SMEMA 1.2: at most 9.5 between modules. The nearest is the conveyor's guide ends to the
                             # oven's end roller (1.05); the belts end 8.0 from the roller, which this does not measure
a = "pnp_conveyor"
b = "reflow_oven"
min_mm = 1.0
max_mm = 9.5

[[clearance]]                # the oven and its stand stand clear of the pick-and-place
a = "pnp_v4"
b = "reflow_oven"
min_mm = 1.0

[[clearance]]
a = "pnp_v4"
b = "oven_stand"
min_mm = 1.0
