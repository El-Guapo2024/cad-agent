# What the fab's fixture must do, as the kernel can measure it.

[envelope]                   # the stage under LumenPnP: inside its 537 mm between the side frames, and the posts and
max_mm = [480, 700, 310]     # frame inside the 690 between its feeder rails with the Y travel

[[clearance]]                # the platen, dropped, under the frame (the swing itself: scratch flip_sweep.py)
a = "platen"
b = "frame_ring_lower"
min_mm = 5.0
pose = "flip"

[[clearance]]                # the board on the platen at work: they touch (vacuum hold-down, heat)
a = "platen"
b = "pcb_blank"
max_mm = 0.05

[[holes]]                    # the platen's vacuum grid
body = "platen"
min_count = 234
min_dia_mm = 0.9
max_dia_mm = 1.1
axis = "z"

[[heat]]                     # reflow and via cure: the platen capped at 240 C (Juan, 2026-11-01)
source = "platen"
temp_c = 240
radius_mm = 15

[[axis]]
name = "y"
direction = [0, 1, 0]
travel_min_mm = 205

[[axis]]
name = "x"
direction = [1, 0, 0]
travel_min_mm = 129

[[axis]]
name = "lift"
direction = [0, 0, 1]
travel_min_mm = 135
