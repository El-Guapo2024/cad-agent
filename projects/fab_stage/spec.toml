# What the fab's fixture must do, as the kernel can measure it.

[envelope]                   # the stage inside the board machine's cabinet (its top rails 810 apart)
max_mm = [480, 1000, 310]

[[clearance]]                # the platen, dropped, under the frame (the swing itself: scratch flip_sweep.py)
a = "platen"
b = "frame_ring_lower"
min_mm = 5.0
pose = "flip"

[[clearance]]                # the board on the platen at work: they touch (vacuum hold-down)
a = "platen"
b = "pcb_blank"
max_mm = 0.05

[[holes]]                    # the platen's vacuum grid
body = "platen"
min_count = 234
min_dia_mm = 0.9
max_dia_mm = 1.1
axis = "z"

[[axis]]
name = "y"
direction = [0, 1, 0]
travel_min_mm = 460          # the tools' reach (305 board + their 175 in front of the lens) to the flip

[[axis]]
name = "x"
direction = [1, 0, 0]
travel_min_mm = 129

[[axis]]
name = "lift"
direction = [0, 0, 1]
travel_min_mm = 135
