[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-agent"
version = "0.1.3"
description = "Agent-driven mechanical CAD: parametric parts, deterministic gates, headless render"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.9",   # OCCT B-rep kernel, STEP in/out, assemblies
    "numpy>=1.26",      # the fallback z-buffer rasteriser
    "trimesh>=4.0",     # ray-cast wall thickness over the tessellated solid
    "rtree>=1.0",       # the spatial index trimesh's ray queries need
    "ocp-tessellate>=3.5",  # the workbench's scene, in three-cad-viewer's format
]

[project.optional-dependencies]
# macOS has no EGL, so there is no headless OpenGL. Metal is the supported
# route and PyObjC reaches it. Without this the numpy rasteriser still works.
metal = ["pyobjc-framework-Metal>=10.0"]
# Embree casts the wall-thickness rays about thirty times faster than trimesh's Python caster and
# finds the same hits, so the numbers do not move. It has wheels for macOS 13 and up, Linux x86_64
# and Windows x86_64; elsewhere the Python caster does the same job slower.
embree = ['embreex>=4.4; platform_machine != "aarch64" and platform_machine != "ARM64"']
dev = ["pytest"]

[project.scripts]
cad = "cad_agent.warm:main"            # the CLI agents drive, via the warm worker; bin/cad runs it without installing

[tool.setuptools.packages.find]
include = ["cad_agent*"]

[tool.setuptools.package-data]
cad_agent = ["workbench/*", "workbench/vendor/*", "workbench/next/*", "workbench/next/assets/*", "workbench/next/freecad-icons/*"]
