[build-system]
requires = ["setuptools>=77.0"]      # 77 reads the SPDX license expression and license-files of PEP 639
build-backend = "setuptools.build_meta"

[project]
name = "cad-agent"
version = "0.2.0"
description = "Agent-driven mechanical CAD: parametric parts, deterministic gates, headless render"
requires-python = ">=3.12"
# The code is MIT; the workbench UI and its build are LGPL-2.1-or-later because they are ported from FreeCAD. What else the wheel
# carries is under the other licences listed (NOTICE says where each applies, THIRD_PARTY_LICENSES has their texts).
license = "MIT AND LGPL-2.1-or-later AND LGPL-2.1-only AND LGPL-2.0-or-later AND BSD-3-Clause AND Zlib AND ISC AND 0BSD AND CC0-1.0 AND CC-BY-3.0 AND CC-BY-SA-2.0 AND CC-BY-SA-4.0 AND MPL-2.0 AND BSL-1.0 AND (GPL-2.0-only WITH Font-exception-2.0 OR GPL-3.0-only WITH Font-exception-2.0 OR LGPL-3.0-only WITH Font-exception-2.0)"
# These go into the wheel's .dist-info/licenses. The three the UI build writes into workbench/next/ are package data, below.
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES", "ui/LICENSE", "ui/NOTICE"]
dependencies = [
    "build123d>=0.9",   # OCCT B-rep kernel, STEP in/out, assemblies
    "numpy>=1.26",      # the fallback z-buffer rasteriser
    "trimesh>=4.0",     # ray-cast wall thickness over the tessellated solid
    "rtree>=1.0",       # the spatial index trimesh's ray queries need
    "ocp-tessellate>=3.5",  # the workbench's scene, in three-cad-viewer's format
    "ezdxf>=1.4",       # DXF in and out: laser parts, drawings (MIT)
    # 3MF for printed parts (BSD-2-Clause). It has wheels for macOS, Linux x86_64 and Windows x86_64
    # and none for Linux aarch64, where pip would otherwise stop at it: cad_agent imports it lazily.
    'lib3mf>=2.4; sys_platform != "linux" or platform_machine != "aarch64"',
    # The Sketcher's text (cad_agent/sketch_text.py), as FreeCAD's Part::makeTextWires makes it: FreeType's glyph
    # outlines (freetype-py, BSD-3-Clause; its wheel carries FreeType, FTL or GPL-2.0) and HarfBuzz's shaping
    # (uharfbuzz, Apache-2.0; its wheel carries HarfBuzz, MIT). Imported only by `cad feature text`.
    "freetype-py>=2.4",
    "uharfbuzz>=0.39",
    # V8 for the server's formula engine (cad_agent/fcexpr.py runs the page's own src/expr.ts, bundled as
    # cad_agent/fcexpr_engine.js): mini-racer (ISC; its wheel carries V8, BSD-3-Clause). Imported on first use.
    "mini-racer>=0.12",
]

[project.optional-dependencies]
# macOS has no EGL, so there is no headless OpenGL. Metal is the supported
# route and PyObjC reaches it. Without this the numpy rasteriser still works.
metal = ["pyobjc-framework-Metal>=10.0"]
# Embree casts the wall-thickness rays about thirty times faster than trimesh's Python caster and
# finds the same hits, so the numbers do not move. It has wheels for macOS 13 and up, Linux x86_64
# and Windows x86_64; elsewhere the Python caster does the same job slower.
embree = ['embreex>=4.4; platform_machine != "aarch64" and platform_machine != "ARM64"']
# ISO fasteners for the part library (`cad lib`), Apache-2.0.
fasteners = ["bd_warehouse>=0.3"]
dev = ["pytest"]

[project.scripts]
cad = "cad_agent.warm:main"            # the CLI agents drive, via the warm worker; bin/cad runs it without installing

[tool.setuptools.packages.find]
include = ["cad_agent*"]

[tool.setuptools.package-data]
cad_agent = ["workbench/*", "workbench/vendor/*", "workbench/next/*", "workbench/next/assets/*", "workbench/next/freecad-icons/*",
             # the notices of the UI bundle, which `npm run build` writes (ui/scripts/licenses.mjs); named so a change to the glob above cannot drop them
             "workbench/next/LICENSE", "workbench/next/NOTICE", "workbench/next/THIRD_PARTY_LICENSES.txt",
             "library/*.toml",
             "techdraw_templates/*.svg", "techdraw_templates/ISO/*.svg", "techdraw_templates/PAT/*.pat", "techdraw_templates/Patterns/*.svg", "techdraw_symbols/*/*.svg", "techdraw_symbols/*/*/*.svg", "techdraw_symbols/*/*/*/*.svg",   # FreeCAD's TechDraw templates (NOTICE)
             "fonts/*", "fcexpr_engine.js"]               # the Sketcher's text font, osifont-lgpl3fe (FreeCAD's default), and its licence       # the part library's catalog (step 6, piece A); its generators are Python packages
