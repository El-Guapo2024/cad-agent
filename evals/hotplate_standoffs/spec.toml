# Hidden grader for hotplate_standoffs: the brief as acceptance tests.
# Every number is stated in brief.md. Axes: z up, base top face at z = 0.
#
# The last entry is the heat zone: the standoffs touch the 250 C plate, so their MATERIAL is judged against
# materials.py (only steel, stainless and polyimide reach 250 C). The base plate is 20 mm away, outside the 15 mm.

[bodies]                    # `parts()` returns exactly these six
count = 6
names = ["base_plate", "hot_plate", "standoff_1", "standoff_2", "standoff_3", "standoff_4"]

[envelope]                  # base footprint x (base underside to plate top)
max_mm = [160, 160, 36]

# The given bodies stay where they are, and what they are.
[[position]]
body = "base_plate"
center_mm = [0, 0, -3]

[[position]]
body = "hot_plate"
center_mm = [0, 0, 25]

[[size]]
body = "base_plate"
min_mm = [159.9, 159.9, 5.9]
max_mm = [160.1, 160.1, 6.1]

[[size]]
body = "hot_plate"
min_mm = [99.9, 99.9, 9.9]
max_mm = [100.1, 100.1, 10.1]

# The air gap: still air between a 250 C plate and the base.
[[clearance]]
a = "hot_plate"
b = "base_plate"
min_mm = 20.0

# Each standoff stands on the base and carries the plate (touching, no overlap).
[[clearance]]
a = "standoff_1"
b = "base_plate"
max_mm = 0.1

[[clearance]]
a = "standoff_2"
b = "base_plate"
max_mm = 0.1

[[clearance]]
a = "standoff_3"
b = "base_plate"
max_mm = 0.1

[[clearance]]
a = "standoff_4"
b = "base_plate"
max_mm = 0.1

[[clearance]]
a = "standoff_1"
b = "hot_plate"
max_mm = 0.1

[[clearance]]
a = "standoff_2"
b = "hot_plate"
max_mm = 0.1

[[clearance]]
a = "standoff_3"
b = "hot_plate"
max_mm = 0.1

[[clearance]]
a = "standoff_4"
b = "hot_plate"
max_mm = 0.1

# Each standoff's bore is the M3 clearance hole over one of the plate's tapped holes.
[[interface]]
a = "standoff_1"
b = "hot_plate"
fastener = "M3"
tol_mm = 0.1
near_mm = 15

[[interface]]
a = "standoff_2"
b = "hot_plate"
fastener = "M3"
tol_mm = 0.1
near_mm = 15

[[interface]]
a = "standoff_3"
b = "hot_plate"
fastener = "M3"
tol_mm = 0.1
near_mm = 15

[[interface]]
a = "standoff_4"
b = "hot_plate"
fastener = "M3"
tol_mm = 0.1
near_mm = 15

# The plate runs at 250 C: every other body within 15 mm of it must be rated for that.
[[heat]]
source = "hot_plate"
temp_c = 250
radius_mm = 15

[[holes]]                     # one through bore, the M3 clearance hole, along z
body = "standoff_1"
count = 1
min_dia_mm = 3.2
max_dia_mm = 3.6
axis = "z"
through = true

[[holes]]
body = "standoff_2"
count = 1
min_dia_mm = 3.2
max_dia_mm = 3.6
axis = "z"
through = true

[[holes]]
body = "standoff_3"
count = 1
min_dia_mm = 3.2
max_dia_mm = 3.6
axis = "z"
through = true

[[holes]]
body = "standoff_4"
count = 1
min_dia_mm = 3.2
max_dia_mm = 3.6
axis = "z"
through = true
