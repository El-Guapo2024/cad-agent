# idler_bracket: the hidden grader. brief.md states every number in here.

# --- the given bodies: where the brief puts them, at their real size ---------
# Pinned so a design cannot pass by moving, dropping or swapping one.

[[position]]
body = "extrusion"
center_mm = [-30, 0, 0]

[[position]]
body = "idler"
center_mm = [22, 0, 0]

[[position]]
body = "shaft"
center_mm = [22, 0, 0]

[[size]]
body = "extrusion"
min_mm = [59.95, 39.95, 19.95]
max_mm = [60.05, 40.05, 20.05]

[[size]]
body = "idler"
min_mm = [17.95, 17.95, 8.45]
max_mm = [18.05, 18.05, 8.55]

[[size]]
body = "shaft"
min_mm = [4.95, 4.95, 19.95]
max_mm = [5.05, 5.05, 20.05]

# --- the whole assembly ---------------------------------------------------------

[envelope]                   # 60 stub + 36 past the end face, the profile's 40 width, its 20 height
max_mm = [96, 40, 20]

# --- the bracket -----------------------------------------------------------------

[[clearance]]                # the idler spins: 0.5 mm to every face of the bracket
a = "idler"
b = "bracket"
min_mm = 0.5

# The shaft passes its holes with 0.1 to 0.5 mm to spare, which makes them 5.2 to
# 6.0 across. Coaxiality cannot say this: `interface` has no size for a 5.0 bore.
[[clearance]]
a = "shaft"
b = "bracket"
min_mm = 0.1
max_mm = 0.5

[[clearance]]                # the back plate rests on the extrusion's end face
a = "bracket"
b = "extrusion"
min_mm = 0
max_mm = 0.05

[[interface]]                # two M5 screws into the extrusion's end bores: clearance over tap
a = "bracket"
b = "extrusion"
fastener = "M5"

# The shaft holes lie on the idler's axis. No `fastener` here: the idler's 5.0 bore
# is none of the M5 sizes (clearance 5.5, tap 4.2, insert 6.4), so it would fail.
[[interface]]
a = "bracket"
b = "idler"
