# The harness checks itself here on every push and pull request: the test
# suite, then `cad verify` on the regression designs in tests/fixtures, the
# same verifier a project's own CI would run. Linux has no Metal, so renders
# use the numpy rasteriser, which a test holds to the Metal output within edge
# noise; that is what lets baselines approved on a Mac gate here.
#
# It installs the embree extra too, as the plugin does, so the tests and the regression designs run on
# the Embree ray caster; a test holds it to the numbers of the Python caster.
#
# FAIL, a bad invocation or a crash turn the run red. UNCHECKED is a warning:
# the hot plate fixture has an honest open item (its mica heater's dimensions
# are unconfirmed), and the verifier is right to say so.
name: ci

on:
  push:
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # tests/test_expr_parity.py runs the workbench's formula engine, bundled for Node, against FreeCAD's recorded answers
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev,embree]"

      # The Sketcher's solver (ui/planegcs/build.sh native), built before the tests: the feature tests solve
      # sketches with it, and tests/test_planegcs.py holds it to FreeCAD's recorded answers. It needs Boost's
      # headers and Eigen 5.0.0, the Eigen FreeCAD is built with.
      - name: Sketch solver
        run: |
          sudo apt-get install -y --no-install-recommends libboost-dev
          curl -sfL https://gitlab.com/libeigen/eigen/-/archive/5.0.0/eigen-5.0.0.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "EIGEN_DIR=$RUNNER_TEMP/eigen-5.0.0" >> "$GITHUB_ENV"
          EIGEN_DIR="$RUNNER_TEMP/eigen-5.0.0" bash ui/planegcs/build.sh native

      # The Assembly's solver (OndselSolver, ui/ondsel/build.sh native): assembly.py's parts() solves with it, and
      # tests/test_assembly_golden.py holds it (and the committed wasm, through Node) to FreeCAD's answers.
      - name: Assembly solver
        run: JOBS=4 bash ui/ondsel/build.sh native

      - name: Tests
        env:
          CAD_RENDER_BACKEND: numpy
        run: |
          timeout 2500 .venv/bin/python -m pytest -v tests -p no:cacheprovider --durations=30 > pytest.log 2>&1; rc=$?
          echo "::warning title=last::$(tail -8 pytest.log | tr '\n' '|' | cut -c1-3000)"
          echo "::warning title=durations::$(grep -A32 'slowest' pytest.log | tr '\n' '|' | cut -c1-6000)"
          echo "::warning title=running::$(grep -E 'PASSED|FAILED|ERROR|SKIPPED' pytest.log | tail -3 | tr '\n' '|' | cut -c1-2000)"
          exit $rc

      - name: Verify the regression designs
        env:
          CAD_WARM: "0"
          CAD_RENDER_BACKEND: numpy
        run: |
          red=0
          for dir in tests/fixtures/*/; do
            slug=$(basename "$dir")
            echo "::group::cad verify $slug"
            # GitHub runs steps with bash -e: capture the verdict without letting it end the step
            bin/cad --projects tests/fixtures verify "$slug" && code=0 || code=$?
            bin/cad --projects tests/fixtures done "$slug" || true
            echo "::endgroup::"
            case $code in
              0) echo "$slug: PASS" ;;
              2) echo "::warning title=$slug UNCHECKED::$slug has open items; see the cad done output" ;;
              *) echo "::error title=$slug::cad verify exited $code"; red=1 ;;
            esac
          done
          exit $red

      - name: Keep the verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts
          path: tests/fixtures/*/verify.json
          if-no-files-found: ignore
