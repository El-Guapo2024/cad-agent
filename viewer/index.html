<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cad view</title>
<style>
  :root { --bg: #1e2226; --ink: #d8dce0; }
  @media (prefers-color-scheme: light) { :root { --bg: #eef0f2; --ink: #1b1f23; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px -apple-system, system-ui, sans-serif; overflow: hidden; }
  #hud { position: fixed; top: 10px; left: 12px; opacity: .85; pointer-events: none; }
  #hud b { font-weight: 600; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="hud">loading…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const hud = document.getElementById('hud');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(2, 3, 4);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.001, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

let model = null, stamp = null, framed = false, title = null;

function frame(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const c = box.getCenter(new THREE.Vector3());
  const r = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(0.75 * r, 0.55 * r, 0.85 * r));
  camera.near = r / 1000; camera.far = r * 100;
  camera.updateProjectionMatrix();
}

async function poll() {
  try {
    const meta = await (await fetch('model.json?' + Date.now())).json();
    if (meta.stamp === stamp) return;
    stamp = meta.stamp;
    if (meta.title !== title) { title = meta.title; framed = false; }  // new project: re-frame
    new GLTFLoader().load('model.glb?' + stamp, (gltf) => {
      if (model) scene.remove(model);
      model = gltf.scene;
      scene.add(model);
      if (!framed) { frame(model); framed = true; }
      hud.innerHTML = `<b>${meta.title}</b> · ${meta.parts} parts · updated ${new Date(meta.stamp * 1000).toLocaleTimeString()}`;
    });
  } catch (e) { hud.textContent = 'waiting for model.json…'; }
}
setInterval(poll, 1500);
poll();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
